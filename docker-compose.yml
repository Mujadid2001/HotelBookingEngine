x-app: &app
  build: .
  image: ${COMPOSE_PROJECT_NAME:-hotel_booking}:latest
  env_file: .env
  restart: unless-stopped
  networks:
    - app-network
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hotel_booking}-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/hotel_booking/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  web:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-hotel_booking}-web
    expose:
      - "${APP_PORT:-8000}"
    volumes:
      - static_volume:/app/hotel_booking/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8000}/api/v1/health/"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hotel_booking}-db
    environment:
      POSTGRES_DB: ${DB_NAME:-hotel_booking}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?error}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hotel_booking}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hotel_booking}-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery_worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-hotel_booking}-celery-worker
    command: celery -A hotel_booking worker -l ${LOG_LEVEL:-info} --concurrency=4 --max-tasks-per-child=1000

  celery_beat:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-hotel_booking}-celery-beat
    command: celery -A hotel_booking beat -l ${LOG_LEVEL:-info} --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  app-network:
    driver: bridge
